<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 개발자 포트폴리오</title>
    <style>
        /* --- 기본 스타일 설정 (CSS) --- */
        :root {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --secondary-color: #1e293b;
            --card-hover: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }

        /* --- 네비게이션 --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 2rem;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent-color); }
        
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a:hover { color: var(--accent-color); }

        /* 모바일 메뉴 버튼 (숨김 처리) */
        .menu-btn { display: none; cursor: pointer; font-size: 1.5rem; }

        /* --- 히어로 섹션 (메인) --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p { font-size: 1.5rem; color: #94a3b8; margin-bottom: 2rem; }
        
        .typing-text::after {
            content: "|";
            animation: blink 1s infinite;
        }

        .btn {
            padding: 0.8rem 2rem;
            background: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        .btn:hover { background: #7dd3fc; transform: translateY(-3px); }

        /* --- 섹션 공통 --- */
        section { padding: 5rem 2rem; max-width: 1200px; margin: 0 auto; }
        .section-title {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 3rem;
            color: var(--accent-color);
        }

        /* --- 프로젝트 섹션 (Grid) --- */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

            background: var(--secondary-color);
            padding: 2rem;
            border-radius: 15px;
